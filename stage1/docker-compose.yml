services:
  stage1-web:
    image: nginx:alpine
    restart: always
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./staging:/usr/share/nginx/staging:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "0.0.0.0:8081:80"
    networks:
      - aegis-stage1-net

networks:
  aegis-stage1-net:
    external: true
