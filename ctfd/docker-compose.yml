services:
  ctfd:
    build: .
    user: root
    restart: always
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - UPLOAD_PROVIDER=filesystem
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=false
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - .:/opt/CTFd:ro
    depends_on:
      - db
    networks:
      - aegis-ctfd-net

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd_root_pw
      - MARIADB_DATABASE=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
    volumes:
      - .data/mysql:/var/lib/mysql
    networks:
      - aegis-ctfd-net

  cache:
    image: redis:7-alpine
    restart: always
    volumes:
      - .data/redis:/data
    networks:
      - aegis-ctfd-net

networks:
  aegis-ctfd-net:
    external: true
